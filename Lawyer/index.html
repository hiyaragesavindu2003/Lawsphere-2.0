<!DOCTYPE html>
<html lang="en">
<head>
    <title>LawSphere Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="left">
        <div class="logo">
    <img src="C:\Users\User\Downloads\WhatsApp Image 2026-10-26 at 6.20.16 PM.jpeg" alt="LawSphere Logo">
</div>
   
    
    <p class="tagline">A CLEARER PATH TO LEGAL SUPPORT</p>

            <h1>
                Confident decisions start with the right counsel.
            </h1>

            <p class="description">
                Connect with trusted legal professionals and
                manage your next steps in one place.
            </p>
        </div>

        <!-- Right Side -->
        <div class="right">

            <div class="login-box">

                <p class="welcome">WELCOME BACK</p>

                <h2>Sign in to your account</h2>

                <p class="subtitle">
                    Enter your details to continue to LawSphere.
                </p>

                <form id="loginForm">

                  <label>User Name</label>
<input type="email" placeholder="Enter your email" required> 

                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>

                    <label>I am a</label>

                    <select>
                        <option>Client</option>
                        <option>Lawyer</option>
                    </select>

                    <button type="submit">Sign in →</button>

                </form>

                <p class="signup">
                    Don't have an account?
                    <a href="register.html">Create account</a>
                </p>

            </div>

        </div>

    </div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.querySelector('input[type="email"]').value.trim().toLowerCase();
    const password = document.querySelector('input[type="password"]').value;
    const role = document.querySelector("select").value;

    if (role === "Lawyer") {

        const lawyer = JSON.parse(localStorage.getItem("lawyer") || "null");

        if (
            lawyer &&
            lawyer.email === email &&
            lawyer.password === password
        ) {
            window.location.href = "./dashboard.html";

        } else {
            alert("Incorrect email or password!");
        }

    } else {
        alert("Client login is not available yet.");
    }
});
</script>


</body>
</html>
